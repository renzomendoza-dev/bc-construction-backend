spring:
  # datasource: supplied by test-support's embedded Postgres

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: WARN