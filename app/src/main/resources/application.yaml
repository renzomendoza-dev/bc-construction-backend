server:
  port: ${SERVER_PORT:8080}

keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:backend}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Fixed at "validate", not env-driven: Flyway owns schema changes, and
      # letting Hibernate auto-generate DDL in any environment risks silently
      # drifting from the migration history.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.issuer-uri}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    doc-expansion: none

app:
  storage:
    local-path: ${STORAGE_LOCAL_PATH:/app/uploads}
    base-url: ${STORAGE_BASE_URL:http://localhost:8080/uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  security:
    # NO DEFAULT VALUE, deliberately. If API_KEY is unset the application
    # context fails to start with an "Could not resolve placeholder
    # 'API_KEY'" error, rather than booting with an empty or guessable key.
    #
    # That failure is the feature: an auth secret that quietly falls back to
    # a default is how an API ends up effectively unprotected in production
    # while looking configured. Fail closed, loudly, at startup.
    api-key: ${API_KEY}

logging:
  level:
    com.bcconstructionservices.inventory: ${LOG_LEVEL:INFO}

